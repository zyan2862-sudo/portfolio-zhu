<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Yan Zhu — International sports project coordinator, sport management researcher and event operations professional in Tokyo.">
  <meta property="og:title" content="Yan Zhu | Sport × Research × Field">
  <meta property="og:description" content="Creating the value of sport across borders.">
  <meta property="og:image" content="assets/og-sport-portfolio.png">
  <meta name="theme-color" content="#03101f">
  <title>Yan Zhu | Sport × Research × Field</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="stadiumIntro.css">
  <script src="portfolioData.js" defer></script><script src="researchSceneData.js" defer></script><script src="introTimeline.js" defer></script><script src="stadiumIntro.js" defer></script><script src="app.js" defer></script>
</head>
<body>
  <div id="stadium-intro" class="stadium-intro" role="dialog" aria-modal="true" aria-label="体育场开场动画" data-phase="loading">
    <div class="intro-scene" aria-hidden="true">
      <picture class="intro-stadium-layer">
        <img src="public/images/intro/stadium-background.webp" alt="">
      </picture>
      <img class="intro-crowd-layer" src="public/images/intro/crowd-foreground.png" alt="">
      <picture class="intro-pitch-layer">
        <img src="public/images/intro/pitch-goal-background.webp" alt="">
      </picture>
      <div class="intro-goal">
        <img class="intro-goal-net intro-goal-net-base" src="public/images/intro/goal-net.png" alt="">
        <img class="intro-goal-net intro-goal-net-hit" src="public/images/intro/goal-net-hit.png" alt="">
        <img class="intro-goal-net intro-goal-net-release" src="public/images/intro/goal-net-release.png" alt="">
        <img class="intro-goal-frame" src="public/images/intro/goal-frame.png" alt="">
        <img class="intro-portal-glow" src="public/images/intro/goal-portal-glow.png" alt="">
      </div>
      <img class="intro-child" src="public/images/intro/child-idle-clean.png" alt="">
      <div class="intro-ball-wrap">
        <img class="intro-ball-shadow" src="public/images/intro/football-shadow.png" alt="">
        <button class="intro-ball-button" type="button" aria-label="点击足球，开始射门并进入网站">
          <img class="intro-ball" src="public/images/intro/football.png" alt="">
        </button>
      </div>
      <div class="intro-kick-dust"></div>
      <div class="intro-vignette"></div>
      <div class="intro-grain"></div>
    </div>
    <button class="intro-skip" type="button"><span>跳过开场</span><small>SKIP INTRO</small></button>
    <div class="intro-loader" role="status"><i></i><span>ENTERING THE FIELD</span></div>
    <div class="intro-prompt" aria-live="polite"><span>点击足球，进入赛场</span><small>KICK OFF MY JOURNEY</small></div>
    <button class="intro-fallback" type="button">进入网站 <span>ENTER SITE</span></button>
    <div class="intro-home-reveal" aria-hidden="true"></div>
  </div>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="Home">YZ<span>27</span></a>
    <button class="menu" aria-label="Toggle menu" aria-expanded="false">MENU</button>
    <nav aria-label="Primary navigation"></nav>
    <div class="tools">
      <button class="theme" aria-label="Toggle color theme">◐</button>
      <div class="langs" aria-label="Language"><button data-lang="zh">中</button><button data-lang="ja">日</button><button data-lang="en">EN</button></div>
    </div>
  </header>
  <main id="main">
    <section class="hero" id="top" data-hero-scene="0">
      <div class="hero-cinematic-stage" aria-hidden="true">
        <figure class="hero-cinematic-bg active"><img src="images/hero-beijing-handprints.jpg" alt="" fetchpriority="high"></figure>
        <figure class="hero-cinematic-bg"><img src="images/hero-beijing-rings.jpg" alt="" loading="lazy"></figure>
        <figure class="hero-cinematic-bg"><img src="images/hero-baseball.jpg" alt="" loading="lazy"></figure>
        <figure class="hero-cinematic-bg"><img src="images/hero-volleyball-stands.jpg" alt="" loading="lazy"></figure>
        <figure class="hero-cinematic-bg"><img src="images/hero-volleyball-live.jpg" alt="" loading="lazy"></figure>
      </div>
      <div class="hero-content"></div>
      <div class="hero-scene-switcher" aria-label="Homepage background">
        <button class="active" data-hero-scene="0">BEIJING 2022</button>
        <button data-hero-scene="1">GLOBAL EVENT</button>
        <button data-hero-scene="2">BASEBALL</button>
        <button data-hero-scene="3">VOLLEYBALL</button>
        <button data-hero-scene="4">LIVE ARENA</button>
      </div>
      <div class="hero-cinematic-meta">
        <span>BEIJING 2022</span><i></i><span>SPORT MANAGEMENT</span><i></i><span>TOKYO</span>
      </div>
      <a class="hero-scroll" href="#about">SCROLL TO EXPLORE ↓</a>
    </section>
    <div class="sport-ticker" aria-label="Sport profile">
      <div><span>LIVE SPORT</span><b>FIELD OPERATIONS</b><span>FAN EXPERIENCE</span><b>SPORT RESEARCH</b><span>SNOW TOURISM</span><b>CHINA ↔ JAPAN</b></div>
    </div>
    <section class="sport-reel" aria-label="Sports field highlights">
      <p>SPORT IS NOT A BACKDROP. IT IS THE FIELD I ENTER.</p>
      <div class="sport-reel-track">
        <div class="sport-reel-row" data-direction="right">
          <figure><img src="images/reel-snowboard.jpg" alt="个人雪上运动经历" loading="lazy"></figure>
          <figure><img src="images/reel-rugby-stadium.jpg" alt="橄榄球比赛现场观赛" loading="lazy"></figure>
          <figure><img src="images/reel-volleyball-arena.jpg" alt="大型排球比赛场馆现场" loading="lazy"></figure>
          <figure><img src="images/reel-baseball-scoreboard.jpg" alt="大学棒球比赛现场" loading="lazy"></figure>
          <figure><img src="images/reel-beijing-portrait.jpg" alt="北京2022工作纪念照片" loading="lazy"></figure>
          <figure aria-hidden="true"><img src="images/reel-snowboard.jpg" alt="" loading="lazy"></figure>
          <figure aria-hidden="true"><img src="images/reel-rugby-stadium.jpg" alt="" loading="lazy"></figure>
          <figure aria-hidden="true"><img src="images/reel-volleyball-arena.jpg" alt="" loading="lazy"></figure>
          <figure aria-hidden="true"><img src="images/reel-baseball-scoreboard.jpg" alt="" loading="lazy"></figure>
          <figure aria-hidden="true"><img src="images/reel-beijing-portrait.jpg" alt="" loading="lazy"></figure>
        </div>
        <div class="sport-reel-row" data-direction="left">
          <figure><img src="images/reel-mountain-portrait.jpg" alt="户外运动中的个人照片" loading="lazy"></figure>
          <figure><img src="images/reel-sumo-staff.jpg" alt="相扑大会工作人员证件" loading="lazy"></figure>
          <figure><img src="images/reel-volleyball-crowd.jpg" alt="排球比赛观众席现场" loading="lazy"></figure>
          <figure><img src="images/reel-research-presentation.jpg" alt="雪上运动旅游研究中期发表" loading="lazy"></figure>
          <figure><img src="images/reel-stadium-portrait.jpg" alt="东京体育场馆现场" loading="lazy"></figure>
          <figure aria-hidden="true"><img src="images/reel-mountain-portrait.jpg" alt="" loading="lazy"></figure>
          <figure aria-hidden="true"><img src="images/reel-sumo-staff.jpg" alt="" loading="lazy"></figure>
          <figure aria-hidden="true"><img src="images/reel-volleyball-crowd.jpg" alt="" loading="lazy"></figure>
          <figure aria-hidden="true"><img src="images/reel-research-presentation.jpg" alt="" loading="lazy"></figure>
          <figure aria-hidden="true"><img src="images/reel-stadium-portrait.jpg" alt="" loading="lazy"></figure>
        </div>
      </div>
    </section>
    <section id="about" class="section reveal"></section>
    <section id="focus" class="section ink reveal"></section>
    <section id="experience" class="section reveal"></section>
    <section id="projects" class="section projects-showcase reveal"></section>
    <section id="research" class="section blue reveal"></section>
    <section id="education" class="section reveal"></section>
    <section id="skills" class="section soft reveal"></section>
    <section id="contact" class="section contact reveal"></section>
  </main>
  <footer></footer>
</body>
</html>
